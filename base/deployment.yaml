apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie-mcp
  namespace: mealie-mcp
spec:
  selector:
    matchLabels:
      app: mealie-mcp
  template:
    metadata:
      labels:
        app: mealie-mcp
    spec:
      containers:
      - name: mealie-mcp
        image: harbor.sirddail.net/ai/mealie-mcp:latest
        ports:
        - containerPort: 8765
