apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie-mcp
  namespace: mealie-mcp
  labels:
    app: mealie-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie-mcp
  template:
    metadata:
      labels:
        app: mealie-mcp
    spec:
      imagePullSecrets:
      - name: mealie-mcp-harbor-pull
      containers:
      - name: mealie-mcp
        image: harbor.sirddail.net/ai/mealie-mcp:sha-9623b85
        imagePullPolicy: IfNotPresent
        ports:
        - name: mcp
          containerPort: 8765
          protocol: TCP
        env:
        - name: MEALIE_BASE_URL
          value: http://mealie.mealie.svc.cluster.local:80
        - name: MEALIE_API_KEY
          valueFrom:
            secretKeyRef:
              name: mealie-mcp-secrets
              key: MEALIE_API_KEY
        - name: MCP_PORT
          value: "8765"
        - name: LOG_LEVEL
          value: INFO
        readinessProbe:
          tcpSocket:
            port: 8765
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: 8765
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 25m
            memory: 250Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          capabilities:
            drop: ["ALL"]
