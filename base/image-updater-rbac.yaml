apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-updater
  namespace: mealie-mcp
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-updater
  namespace: mealie-mcp
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-updater
  namespace: mealie-mcp
subjects:
- kind: ServiceAccount
  name: image-updater
  namespace: mealie-mcp
roleRef:
  kind: Role
  name: image-updater
  apiGroup: rbac.authorization.k8s.io
